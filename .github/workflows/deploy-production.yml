name: Deploy production

# Runs when the owner merges into the production branch.
# Needs repository secrets (set by the owner, never by Claude):
#   CPANEL_HOST       e.g. server.example.com (no https://)
#   CPANEL_USER       cPanel username
#   CPANEL_TOKEN      cPanel API token
#   CPANEL_REPO_ROOT  path of the production clone in cPanel Git Version Control
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets are set
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          for v in CPANEL_HOST CPANEL_USER CPANEL_TOKEN CPANEL_REPO_ROOT; do
            if [ -z "${!v}" ]; then echo "REFUSE: secret $v is not set; nothing done"; exit 1; fi
          done

      - name: Backup home directory first
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          T: ${{ secrets.CPANEL_TOKEN }}
        run: |
          out=$(curl -fsS -H "Authorization: cpanel $U:$T" "https://$H:2083/execute/Backup/fullbackup_to_homedir")
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status")==1 else "FAIL backup: "+str(d.get("errors")))'
          echo "PASS backup requested (cPanel emails when it is done)"

      - name: Pull production branch in cPanel
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          T: ${{ secrets.CPANEL_TOKEN }}
          ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          out=$(curl -fsS -G -H "Authorization: cpanel $U:$T" \
            --data-urlencode "repository_root=$ROOT" --data-urlencode "branch=production" \
            "https://$H:2083/execute/VersionControl/update")
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status")==1 else "FAIL pull: "+str(d.get("errors")))'
          echo "PASS pulled"

      - name: Deploy HEAD commit
        env:
          H: ${{ secrets.CPANEL_HOST }}
          U: ${{ secrets.CPANEL_USER }}
          T: ${{ secrets.CPANEL_TOKEN }}
          ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
        run: |
          out=$(curl -fsS -G -H "Authorization: cpanel $U:$T" \
            --data-urlencode "repository_root=$ROOT" \
            "https://$H:2083/execute/VersionControlDeployment/create")
          echo "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status")==1 else "FAIL deploy: "+str(d.get("errors")))'
          echo "PASS deploy queued; check cPanel Git Version Control > History"

name: Demo cleanup

# Moves the old theme's demo content on STAGING to the Trash with
# tools/cleanup_demo.py (restore from Trash within 30 days). Keeps the pages
# in site/pages.json, the WooCommerce/privacy pages and agent articles.
# Media is never touched. Run it from the Actions tab (Run workflow).
# Dry run unless "apply" is ticked.
# Secrets: STAGING_WP_USER / STAGING_WP_APP_PASSWORD (a staging Administrator).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Move to the Trash on staging (unticked = dry run)"
        type: boolean
        default: false
      types:
        description: "What to clean"
        type: choice
        default: posts,pages,products
        options:
          - posts,pages,products
          - posts,pages

permissions:
  contents: read

concurrency:
  group: demo-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04
    environment: staging
    steps:
      - uses: actions/checkout@v6

      - name: Run cleanup_demo.py on staging.nostek.id
        env:
          REF: ${{ github.ref_name }}
          APPLY: ${{ inputs.apply }}
          TYPES: ${{ inputs.types }}
          NOSTEK_WP_URL: https://staging.nostek.id
          NOSTEK_WP_USER: ${{ secrets.STAGING_WP_USER }}
          NOSTEK_WP_APP_PASSWORD: ${{ secrets.STAGING_WP_APP_PASSWORD }}
        run: |
          if [ "$REF" != "main" ]; then
            echo "REFUSE: run this from main (got $REF); nothing done"
            exit 1
          fi
          if [ -z "$NOSTEK_WP_USER" ] || [ -z "$NOSTEK_WP_APP_PASSWORD" ]; then
            echo "FAIL: secrets STAGING_WP_USER / STAGING_WP_APP_PASSWORD are not set; nothing done"
            exit 1
          fi
          if [ "$APPLY" = "true" ]; then
            python3 tools/cleanup_demo.py --types "$TYPES" --apply
          else
            python3 tools/cleanup_demo.py --types "$TYPES"
          fi

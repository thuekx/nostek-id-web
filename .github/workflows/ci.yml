name: CI

on:
  pull_request:
  push:
    branches: [main, production]

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR's commits

jobs:
  check:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: PHP syntax (8.1)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: none
      - run: |
          find themes plugins -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JSON files are valid
        run: |
          find themes plugins site -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

      - name: Python tools compile
        run: python3 -m py_compile tools/*.py bin/*.py

      - name: Block markup comments are balanced
        run: python3 bin/check-blocks.py


      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
